name: Test CI

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Core cache
        uses: actions/cache@v4
        id: core-cache
        with:
          path: |
            core/*
            !core/live2d.d.ts
          key: ${{ runner.os }}-
          restore-keys: |
            ${{ runner.os }}-

      - name: Install dependencies
        # Retry transient registry failures, but fail after three attempts.
        run: |
          for attempt in 1 2 3; do
            yarn --frozen-lockfile && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency installation failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Setup core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: yarn setup

      - uses: GabrielBB/xvfb-action@v1.0
        with:
          run: yarn test:ci
